[tool.poetry]
name = "valutatrade-hub"
version = "1.0.0"
description = "Консольное приложение для управления валютным кошельком"
authors = ["Nikolai Shilenko <nick.shilenko@gmail.com>"]
readme = "README.md"
packages = [{include = "valutatrade_hub", from = "."}]

[tool.poetry.dependencies]
python = "^3.9"
prettytable = "^3.10.0"
requests = "^2.31.0"
python-dotenv = "^1.2.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.2"

[tool.poetry.scripts]
project = "main:main"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"